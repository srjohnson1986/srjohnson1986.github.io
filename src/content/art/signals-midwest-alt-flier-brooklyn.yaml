title: "Signals Midwest tour alt flier: Brooklyn"
year: 2025
date: "2025.10.05"
order: 1
medium: show-flyer
format: square
image: ../../assets/art/signals-midwest-alt-fliers-4.jpg
alt: >-
  Square black and white band photo flyer for Signals Midwest and Five Hundred Bucks on 10.05.2025
  at The Broadway in Brooklyn, NY, with the supporting bands still marked Cool Band 1 and Cool
  Band 2.
caption: >-
  2025.10.05 - with Good Looking Friends and Freezing Cold. I got sick of this alt flier project
  around this point so I never filled in the band names.
tags: [five-hundred-bucks]
story:
  - >-
    Five Hundred Bucks was asked to go on a tour with Signals Midwest as direct support. In the
    spirit of keeping people humble, I made some alt fliers for social media featuring Five Hundo
    more prominently using promo photos we'd recently taken in Lancaster, PA before a show at
    Nomad Skate Shop (RIP). Additional photos and textures are from around Nomad, Lancaster, and
    our guitar player's house in Philly. The cuck chair is from the men's bathroom at the Earl.
  - >-
    Siggies are the sweetest and most humble people and an amazing band so everything worked out.
    11/10 would recommend touring with them forever.
