    alt: >-
      Square black and white flyer for Five Hundred Bucks on tour with Signals Midwest, 10.3.2025
      at Faces Brewing Co. in Malden, MA with Hey I'm Outside and Little Low, showing four men
      eating ice cream.
    caption: "2025.10.03 - with Hey I'm Outside and Little Low"
  - image: ../../assets/art/signals-midwest-alt-fliers-3.jpg
    alt: >-
      Square flyer with green and brown lettering on a framed, patterned background: Give a Damn,
      Signals Midwest, Downhaul, Five Hundred Bucks and Nothing Wrong on 10.04.2025 at Ortlieb's
      in Philly.
    caption: "2025.10.04 - with Downhaul and Nothing Wrong"
  - image: ../../assets/art/signals-midwest-alt-fliers-4.jpg
    alt: >-
      Square black and white band photo flyer for Signals Midwest and Five Hundred Bucks on
