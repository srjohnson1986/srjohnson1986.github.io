title: "Alt fliers for the Signals Midwest tour"
year: 2025
date: "2025.10.02-05"
order: 1
medium: show-flyer
format: square
image: ../../assets/art/signals-midwest-alt-fliers.jpg
alt: >-
  Square flyer for Five Hundred Bucks and Signals Midwest with Whose Hands Are These? and
  Stereoma on 10-2-2025 at Zoetropolis in Lancaster, PA, with a man licking an ice cream cone
  in front of a graffiti wall.
caption: "2025.10.02 - with Whose Hands Are These? and Stereoma"
story:
  - >-
    Five Hundred Bucks was asked to go on a tour with Signals Midwest as direct support. In the
    spirit of keeping people humble, I made some alt fliers for social media featuring Five
    Hundo more prominently using promo photos we'd recently taken in Lancaster, PA before a show
    at Nomad Skate Shop (RIP). Additional photos and textures are from around Nomad, Lancaster,
    and our guitar player's house in Philly. The cuck chair is from the men's bathroom at the
    Earl.
  - >-
    Siggies are the sweetest and most humble people and an amazing band so everything worked
    out. 11/10 would recommend touring with them forever.
more:
