title: Thermal Process Development Excel add-in
summary: >-
  An open-source VBA add-in that turns Smartsheet exports into branded equipment lists,
  project schedules, and vendor quote packages.
year: 2026
type: tool
tags:
  - excel
  - vba
  - automation
