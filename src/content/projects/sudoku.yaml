title: Sudoku with graded puzzles up to 25x25
navTitle: Sudoku
summary: >-
  A Sudoku game on this site with boards from 4x4 to 25x25. Every puzzle is made in the browser,
  has exactly one solution, and is graded by the techniques it needs.
