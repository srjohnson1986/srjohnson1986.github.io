# The words on the Home, Art, Audio, Creative, Contact, Jabroni Fest, Development, and 404 pages: each page's
# browser title and description, its lead line, and the other small pieces of text noted below. The
# wording is the owner's own. The build checks the same copy rules as everywhere else (single hyphens
# only, no phone numbers).
#
# Two things you can write in the text:
#   {name} and {area}  are filled in from src/data/site.ts, the one place they are written.
#   [words](/page/)    makes a link, to a page on this site (/resume/) or a section (#studio) only.

- id: home
  title: "{name} | QA, automation, process improvement, and audio"
  description: >-
    {name}: QA, automation, process improvement, audio engineer, and digital transformation consultant in the {area}.
    Resume, projects, audio, and art.
  # The line under the name.
  lead: Find it, understand it, fix it, automate it.
  paragraphs:
    - >-
      Quality has been my thing for over ten years, first at Verizon and now as a consultant building automation and running projects.
      Outside of work I play in and record bands at my home studio, help organize a charity music festival, and make fliers in Procreate.
      Different practices, same idea - sweat the details so the finished product feels great.

- id: art
  title: "Art | {name}"
  description: Show flyers and other art made in Procreate, with the story behind each piece.
  # Shown instead of the gallery when there are no pieces.
  empty: Artwork is on the way. Show flyers and other Procreate work will appear here.
  # Shown when the filters match no pieces.
  no_match: No pieces match these filters. Try removing one.
  # The line under the Art heading.
  lead: >-
    Show flyers and other work made in Procreate. Open a piece to read more about it.
  # The owner's note on how he makes flyers, shown under the lead.
  paragraphs:
    - >-
      I love the look of imperfect copy-collaged/vandalized zines and old boxing fliers so I try
      to emulate those. I also like poking fun at bad or low-effort fliers. Bands, venues, and
      promoters like knowing they're being paid attention to, but keeping them humble is of utmost
      importance.
    - >-
      To me, fliers need to have bands, location, and date. It's common knowledge punk shows start
      around 7, and if you want to get specifics, you can do some googling after knowing you like
      the bands, have the means, and want to make the show a priority that evening.
      Preferentially, I like seeing the year, but I'll concede that if it makes things busier than
      I want.
    - >-
      I HATE boring looking band names/logos. I try to make sure they're angled, traced, and/or
      fonted in a unique way.

- id: audio
  title: "Audio | {name}"
  description: >-
    Recordings made at Kingdom Hell, my home studio: production and engineering for other artists,
    with a player for each release.
  # The line pointing down to the studio rates.
  studio_link: Looking to record? [Rates and how to prepare](#studio) are at the bottom of the page.
  # Shown instead of the list when there are no releases.
  empty: Releases are on the way. Recordings made at Kingdom Hell will appear here.
  # Shown when the filters match no release.
  no_match: No releases match these filters. Try removing one.
  # The line under the Audio heading.
  lead: >-
    Recordings made at Kingdom Hell, my home studio, mostly production and engineering for other
    artists. The roles shown are the ones credited to me on each release's Bandcamp page, where the
    full credits are.

- id: contact
  title: "Contact | {name}"
  description: How to reach {name}.
  # The closing line under the contact details.
  closing: Looking for my background? See the [resume](/resume/).
  # Shown first, and only when an email address is published (see src/data/site.ts).
  email_note: Email is the best way to reach me.
  # The line under the Contact heading. {area} is replaced with the area set in src/data/site.ts,
  # which is the only place the location is written.
  lead: I am based in the {area}.

- id: not-found
  title: "Page not found | {name}"
  description: That address is not part of this site.
  # The 404 page, shown for an address the site does not have.
  heading: Page not found
  lead: >-
    That address is not part of this site. It may have been mistyped, or the page may have moved.
  # The button that goes to the home page.
  button: Go to the home page
  # The heading above the list of main sections.
  links_heading: Or try one of these

- id: jabroni-fest
  title: "Jabroni Fest | {name}"
  # Used when the events data has no summary of its own to show.
  description: Jabroni Fest, the annual charity music festival I help organize, and the smaller shows around it.
  lead: Live music I help put on, run by volunteers.

- id: creative
  title: "Creative | {name}"
  description: >-
    The creative side of {name}'s work: audio production, show flyers and other art, and the Jabroni Fest charity
    music festival.
  lead: Music, art, and shows - the things I make and help put on outside of work.
  # Draft wording, ready for the owner to rewrite.
  paragraphs:
    - >-
      I play in bands and record other people's at Kingdom Hell, my home studio. I make show fliers in Procreate,
      and I help organize Jabroni Fest, an annual charity music festival. Three practices, one habit: care about
      the details until the finished thing feels right.
  # The cards that link to the pages under Creative, in the order they appear.
  cards:
    - title: Audio
      blurb: "Kingdom Hell, my home studio: audio production, engineering, mixing, and mastering."
      href: /audio/
    - title: Art
      blurb: Mostly show fliers made in mostly Procreate.
      href: /art/
    - title: Jabroni Fest
      blurb: An annual charity music festival run by three volunteers, raising money for Y'all Rock Camp ATL.
      href: /jabroni-fest/

- id: development
  title: "Development | {name}"
  description: >-
    Every software project I have built: apps, tools, and sites, with the problem, the build, the
    stack, and the outcome.
  lead: >-
    Every software project I have built, newest first. Each one has its own page with the problem,
    what I built, the stack, the outcome, and links to the code.
  # Shown when the filters match no project.
  no_match: No projects match these filters. Try removing one.
