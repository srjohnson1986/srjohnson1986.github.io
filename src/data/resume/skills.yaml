# Core Skills, in the four groups that match the Core Skills block on the resumes.
# Items are plain strings, or objects with:
#   only: [variant ids]    show the skill on those resume versions only (today the only version is creative)
#   lane_only: true        never shown on a resume version; only a lane resume (lanes.yaml) can list it
#   training_only: true    keep the skill in the list, but fail the build if any public
#                          bullet mentions it
# Reorder items within a group to match what a posting emphasizes.

- id: quality-testing
  order: 1
  group: Quality & Testing
  items:
    - Automated and Manual Testing
    - Regression
    - Test Planning
    - SDLC
    - Agile
    - DevOps
    - Defect Analysis
    - Environment Validation
    - Test Case Management
    - Exploratory Testing
    - Requirements Traceability
    # Shown on the lane resumes only (lanes.yaml); backed by the portfolio site bullets.
    - { name: API and Contract Testing, lane_only: true }
    - { name: Accessibility Testing, lane_only: true }
    - { name: Performance Testing, lane_only: true }

