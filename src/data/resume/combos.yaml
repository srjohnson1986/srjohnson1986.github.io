# Combined bullets: one bullet that can stand in for one or more bullets of the same role (one means a shorter wording of a single bullet) when a lane's
# resume runs over two pages. Each entry names the bullets it replaces and the lanes it may be used in;
# it is only usable in a lane where every bullet it replaces is also tagged for that lane (the build checks
# this, see src/lib/lane-data.js). Text follows the same copy rules as a bullet.
# This file is written by scripts/import-lanes.mjs from the Combined bullets in the bank.
# Edit them in the bank, not here.

- id: tpd-combo-unit-tests-ci-drift-check
  role: tpd
  replaces: [tpd-split-business-logic-out, tpd-added-github-actions-workflow, tpd-created-pre-release-source-drift-check]
  lanes: [qa, sdet]
  text: >-
    Created 20+ Rubberduck unit tests, a GitHub Actions workflow that checks every code
    change for broken ribbon buttons and missing coding standards, and a pre-release check
    that the source matches the built add-in, catching regression defects and shipping
    mismatches before users could see them.

- id: tpd-combo-releases-smoke-test
  role: tpd
  replaces: [tpd-delivered-11-versioned-releases, tpd-wrote-manual-smoke-test-checklist]
  lanes: [qa, sdet]
  text: >-
    Delivered 11+ versioned releases, every one verified against a manual smoke-test
    checklist for every ribbon tool using fabricated sample data from a Python script,
    confirming the tools worked before users received them without exposing any customer
    data.

- id: vz-combo-test-management-plans
  role: verizon
  replaces: [vz-managed-test-cases-zephyr-qtest, vz-wrote-test-plans-defined-scope, vz-defined-defect-assignment-escalation-paths]
  lanes: [qa]
  text: >-
    Managed test cases in Zephyr and then qTest, Verizon's primary test case management
    tool, for more than eight years, and wrote test plans covering scope, resource
    estimates, and defect escalation paths, keeping testing organized, traceable, and
    realistically staffed.

- id: vz-combo-kibana-monitoring
  role: verizon
  replaces: [vz-monitored-application-error-logs, vz-investigated-defects-through-kibana, vz-spotted-patterns-across-recurring]
  lanes: [qa, sdet, it]
  text: >-
    Monitored Kibana error logs from launch war rooms during device launches and peak retail
    events, escalating live production issues while the launch was underway, and
    investigated defects through the logs, filing them with evidence and confirming fixes
    held after deploy, limiting customer impact and helping developers fix problems fast.

- id: vz-combo-payments
  role: verizon
  replaces: [vz-validated-way-customers-paid-cards, vz-proved-card-authentication-held-across, vz-matched-payment-outcome-against-customer]
  lanes: [qa, sdet]
  text: >-
    Verified every payment method across checkout, bill pay, and AutoPay, including the full
    3D Secure, address, and security code test matrix, confirming in Kibana that every
    transaction returned the expected status code and matched what the customer saw,
    protecting customers from payment outcomes that didn't match what actually happened.

- id: vz-combo-traceability-defect-standard
  role: verizon
  replaces: [vz-enforced-requirements-traceability-linking, vz-set-team-standard-defects]
  lanes: [qa]
  text: >-
    Enforced a team standard linking every defect to its test case and requirement, with
    preconditions, steps, expected vs actual results, and evidence, improving defect quality
    and showing at a glance whether the defect, test, or requirement was wrong.

- id: ps-combo-ci-accessibility-smoke
  role: portfolio-site
  replaces: [ps-automated-accessibility-scanning, ps-configured-github-actions-suite-smoke]
  lanes: [qa, sdet]
  text: >-
    Configured GitHub Actions to run the suite on every pull request, including axe
    accessibility scans of every page in light, dark, and phone width, plus a smoke test
    against the live site after each deploy and weekly, catching broken changes before they
    merge and live-site problems that appear between deploys.

- id: ps-combo-requirements-traceability
  role: portfolio-site
  replaces: [ps-linked-every-playwright-test-requirement, ps-built-script-joins-playwright-results, ps-created-ci-gate-fails-build, ps-tested-checks-well-product-breaking]
  lanes: [qa, sdet]
  text: >-
    Linked every one of 760+ Playwright tests to a GitHub requirement issue and added a CI
    gate that fails on untested requirements, unknown tags, or untagged tests, confirmed by
    breaking each rule on purpose.

- id: ps-combo-api-contract-tests
  role: portfolio-site
  replaces: [ps-automated-api-contract-tests-project, ps-covered-failures-happy-path-check-misses, ps-verified-api-checks-themselves-deliberately, ps-wrote-postman-collection-run-newman]
  lanes: [qa, sdet]
  text: >-
    Automated 47 API and contract tests (40 mocked on every pull request, 7 live weekly)
    with JSON Schema contracts and a Newman-run Postman collection, proving them with
    deliberate schema, mock, and code breaks.

- id: ps-combo-ai-evaluation-suite
  role: portfolio-site
  replaces: [ps-created-evaluation-suite-measures-how, ps-uncovered-embellished-details-reading, ps-distinguished-service-outages-quality-drops]
  lanes: [qa, sdet]
  text: >-
    Created an evaluation suite that measures how reliably AI drafts resume bullets, scoring
    repeated runs of fixed prompts against coded content rules and failing the build if the
    pass rate drops below 95%.

- id: ps-combo-performance-testing
  role: portfolio-site
  replaces: [ps-created-automated-page-speed-checks-google, ps-created-load-test-k6-simulates, ps-fixed-font-loading-problem-made-page, ps-stabilized-page-speed-check-switching-it]
  lanes: [qa, sdet]
  text: >-
    Built automated page-speed checks and a load test that keep the site fast for visitors,
    show reviewers whether speed held on every site change, and fixed a font-loading problem
