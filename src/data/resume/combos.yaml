# Combined bullets: one bullet that can stand in for two or more bullets of the same role when a lane's
# resume runs over two pages. Each entry names the bullets it replaces and the lanes it may be used in;
# it is only usable in a lane where every bullet it replaces is also tagged for that lane (the build checks
# this, see src/lib/lane-data.js). Text follows the same copy rules as a bullet.
# This file is written by scripts/import-lanes.mjs from the Combined bullets in the bank.
# Edit them in the bank, not here.

- id: tpd-combo-unit-tests-ci-drift-check
  role: tpd
  replaces: [tpd-split-business-logic-out, tpd-added-github-actions-workflow, tpd-created-pre-release-source-drift-check]
  lanes: [qa, sdet]
  text: >-
    Added 20 Rubberduck unit tests and a GitHub Actions workflow that checks every code
    change for broken ribbon callbacks and missing coding standards, plus a pre-release
    check that the source matches what ships in the built add-in.

- id: tpd-combo-releases-smoke-test
  role: tpd
  replaces: [tpd-delivered-11-versioned-releases, tpd-wrote-manual-smoke-test-checklist]
  lanes: [qa, sdet]
  text: >-
    Delivered 11+ versioned releases, each checked against a manual smoke-test checklist
    with expected results for every ribbon tool, using fabricated sample data generated by a
    Python script.

- id: vz-combo-test-management-plans
  role: verizon
  replaces: [vz-managed-test-cases-zephyr-qtest, vz-wrote-test-plans-defined-scope, vz-defined-defect-assignment-escalation-paths]
  lanes: [qa]
  text: >-
    Managed test cases in Zephyr and then qTest, Verizon's primary test case management
    tool, for more than eight years, and wrote test plans defining scope by environment,
    flow, and platform, resource estimates, and defect escalation paths.

- id: vz-combo-kibana-monitoring
  role: verizon
  replaces: [vz-monitored-application-error-logs, vz-investigated-defects-through-kibana, vz-spotted-patterns-across-recurring]
  lanes: [qa, sdet, it]
  text: >-
    Monitored Kibana error logs from launch war rooms during device launches and peak retail
    events, escalating live production issues while the launch was underway, and
    investigated defects through the logs, filing them with log evidence and confirming
    fixes held after deploy.

- id: ps-combo-ci-accessibility-smoke
  role: portfolio-site
  replaces: [ps-automated-accessibility-scanning, ps-configured-github-actions-suite-smoke]
  lanes: [qa, sdet]
  text: >-
    Configured GitHub Actions to run the suite on every pull request, including axe
    accessibility scans of every page in light, dark, and phone width, plus a smoke test
    against the live site after each deploy and weekly.
