- id: ps-combo-ai-usage-cost-control
  role: portfolio-site
  replaces: [ps-budgeted-ai-usage-capping-evaluation]
  lanes: [sdet, it]
  text: >-
    Controlled the cost and security risk of live AI calls with a hard call cap, a low-cost
    model (under a cent per run), and a secrets-only API key, letting the evaluation run
    weekly without cost surprises or exposed credentials.
