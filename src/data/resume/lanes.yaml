# The job lanes that get a generic, auto-fitted resume. `code` is the short code the resume bullet bank
# uses in its tags (for example QA1.20 on a bullet, or [QA4 SDET3 ...] on a role heading); `id` is the
# lowercase key used in `lanes` on bullets and `lane_rank` on roles. Lanes are data: add one here and it
# is a valid key everywhere, with no code change. `order` is the display order.
#
# Per lane:
#   summary_id    the summary printed on the lane's resume (summaries.yaml)
#   org_labels    real or neutral employer names
#   skills        the lane's own Core Skills: skill group id (skills.yaml) -> names in display order. Each name
#                 must exist in that group in skills.yaml (a skill with lane_only: true shows on lanes only)
#   role_floor    the fewest bullets a role keeps when the resume is trimmed to fit two pages
#   projects_section  optional, true to show the roles of kind "project" (roles.yaml) under their own Projects heading,
#                 ahead of Experience. On for the lanes whose strongest work is project work (QA, SDET); the other lanes
#                 have one small project, which reads better inside Experience.
#
# The lane resumes are built at /resume/print/lane-<id>/ and as PDFs, but nothing links to them yet.

- id: qa
  code: QA
  label: QA Engineer
  order: 1
  summary_id: summary-lane-qa
  org_labels: real
  skills:
    quality-testing: [Automated and Manual Testing, Regression, Test Planning, Test Case Management, Exploratory Testing, Defect Analysis, Requirements Traceability, Environment Validation, SDLC, Agile]
    tools-platforms: [Jira, qTest, Zephyr, Postman, Kibana, Chrome DevTools, Burp Suite, Playwright, Selenium, GitHub Actions CI/CD]
    technical: [Troubleshooting, Software Documentation]
    languages: [SQL, Python, HTML, CSS]
  role_floor: { tpd: 2, verizon: 2 }
  projects_section: true

