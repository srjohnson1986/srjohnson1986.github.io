# The hand-written resume versions. Only Creative is left: the QA, Consulting, and Adoption versions were replaced by the
# six lane resumes (lanes.yaml), which are built from the bullet bank. A variant is a summary, a label mode, and its bullets: optional shared groups (see
# bullet-groups.yaml) followed by its own list of bullet ids. The web Resume page and
# every PDF render from this file, so they cannot drift apart. Within a variant, bullets are
# grouped under their role; the order here (groups first, then its own list) is the display
# order inside each role. The build
# fails if a bullet is missing or not public. A repeated opening verb only prints a warning.

- id: creative
  order: 3
  label: Creative / Music-adjacent
  summary_id: summary-creative
  org_labels: real
  bullets:
    - kh-produced-engineered-dozens-recordings
    - kh-programmed-humanized-midi-parts
    - kh-performed-several-releases-addition
    - kh-designed-studio-signal-routing
    - kh-produced-engineered-studio-projects-studio-one
    - kh-diagnosed-signal-problems-tracing
    - kh-learned-configured-unfamiliar-effects
    - jp-organized-annual-charity-music
    - jp-managed-venue-booking-band
    - jp-kept-tight-stage-changeovers
    - jp-set-clear-upfront-expectations
    - tpd-built-maintained-open-source-vba
    - cb-combined-ai-coding-agent
    - cb-delivered-v1-two-platforms
    - gs-diagnosed-desktop-laptop-problems-running
