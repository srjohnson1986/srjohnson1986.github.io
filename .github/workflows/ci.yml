name: CI

# Builds the site (including the resume PDFs) and runs the Playwright suite against it on every
# pull request, without deploying. This catches a broken build or a failing check before it can
# reach `main`, where a merge would deploy it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read # the traceability check reads the requirement issues

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the PDF step
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Build the site and the resume PDFs
        run: npm run build

      - name: Check the lane resume fits are up to date and still fit two pages
        run: npm run fit-lanes -- --check

      - name: Run the Playwright test suite
        run: npx playwright test

      # Every requirement needs a test (or the no-automated-test label with a written reason), and every
      # test needs a real requirement. Runs even when a test failed, so the matrix is always produced.
      # Writes the matrix to the job summary and to traceability/.
      - name: Check requirements traceability
        if: ${{ !cancelled() }}
        run: node scripts/traceability.mjs

      - name: Keep the traceability matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traceability
          path: traceability/
          retention-days: 14

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
