name: CI

# Builds the site (including the resume PDFs) and runs the Playwright suite against it on every
# pull request, without deploying. This catches a broken build or a failing check before it can
# reach `main`, where a merge would deploy it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read # the traceability check reads the requirement issues

# A newer push to a pull request cancels the run still going for the older one, so a quick second push does
# not wait behind the first. A manual run (workflow_dispatch) on a branch has a different ref from that branch's
# pull request run (refs/heads/... against refs/pull/N/merge), so the two groups never meet: neither cancels the other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The measured runs took 160 to 212 seconds. Twenty minutes leaves room for a slow runner day, and a hung
    # run stops here instead of running for GitHub's six hour default.
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # onnxruntime-node (used by npm run embeddings) would download GPU libraries here. This project uses the CPU only,
        # and CI never loads the model, so skip it: a slow download must not fail a build.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Install Chromium for the PDF step
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Build the site and the resume PDFs
        run: npm run build

      - name: Check the lane resume fits are up to date and still fit two pages
        run: npm run fit-lanes -- --check

      # Fails when an approved bullet is missing from retrieval/embeddings.json or an entry is stale.
      # Needs no model and no key.
      - name: Check the embedding index is complete and current
        run: npm run embeddings -- --check

      - name: Run the Playwright test suite
        run: npx playwright test

      # Writes the Git tree id of the code this run tested (a fingerprint of every tracked file) next to the
      # results. The deploy reuses these results instead of running the suite again, but only when the code
      # it is deploying has the same tree id (see scripts/reuse-ci-results.mjs).
      - name: Record which code the results are for
        if: ${{ !cancelled() }}
        run: mkdir -p traceability && git rev-parse 'HEAD^{tree}' > traceability/source-tree.txt

      # Every requirement needs a test (or the no-automated-test label with a written reason), and every
      # test needs a real requirement. Runs even when a test failed, so the matrix is always produced.
      # Writes the matrix to the job summary and to traceability/.
      - name: Check requirements traceability
        if: ${{ !cancelled() }}
        run: node scripts/traceability.mjs

      - name: Keep the traceability matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traceability
          path: traceability/
          retention-days: 14

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
