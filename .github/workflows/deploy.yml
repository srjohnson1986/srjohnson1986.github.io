name: Deploy to GitHub Pages

on:
  # Build and publish on every push to main
  push:
    branches: [main]
  # Allow a manual run from the Actions tab
  workflow_dispatch:

# Permissions the deploy needs: read the code, publish to Pages
permissions:
  contents: read
  issues: read # the traceability report reads the requirement issues
  actions: read # to find the pull request's CI run and download its test results
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The measured deploys took about 80 seconds when they reused the pull request's results and about 200 seconds
    # when the suite ran here. Fifteen minutes covers a slow day; a hung build stops instead of running for six hours.
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The pull request's CI run already ran the whole suite. When that run tested exactly the code being
      # deployed (the same Git tree), this copies its results to traceability/results.json and the build
      # below skips the suite, which saves about two minutes. Otherwise it writes nothing and the suite
      # runs here as before. A failed lookup must never fail a deploy: the script exits 0 whatever happens,
      # and continue-on-error covers the case where the script cannot even start.
      # The GitHub CLI reads the job's GITHUB_TOKEN.
      - name: Reuse the pull request's test results when they are for this exact code
        continue-on-error: true
        run: node scripts/reuse-ci-results.mjs
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        # onnxruntime-node (used by npm run embeddings) would download GPU libraries in the action's own npm ci. This project uses the CPU only,
        # and CI never loads the model, so skip it: a slow download must not fail a build.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        with:
          # `npm run build` also prints the resume PDFs, which needs headless Chromium.
          # The action installs npm dependencies first, then runs this command in bash.
          #
          # Then it writes the requirements traceability matrix into the site, over the stand-in page at
          # /development-qa/this-site/traceability/. The matrix needs test results: the step above may have
          # put the pull request's results in traceability/results.json; if that file is not there, the
          # suite runs here. The suite already had to pass in the pull request, so a flaky failure here
          # must not block a deploy: the test step and the report step both tolerate problems, and the
          # matrix shows the last result honestly. The smoke test fails if the report did not make it
          # into the site.
          build-cmd: >-
            npx playwright install --with-deps chromium-headless-shell &&
            npm run build &&
            (test -f traceability/results.json || npx playwright test || true) &&
            node scripts/traceability.mjs --into dist --allow-problems

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No timing was measured for this job (it only publishes the built site). Ten minutes is a generous ceiling.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
