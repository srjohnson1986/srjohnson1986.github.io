name: Deploy to GitHub Pages

on:
  # Build and publish on every push to main
  push:
    branches: [main]
  # Allow a manual run from the Actions tab
  workflow_dispatch:

# Permissions the deploy needs: read the code, publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          # `npm run build` also prints the resume PDFs, which needs headless Chromium.
          # The action installs npm dependencies first, then runs this command in bash.
          build-cmd: npx playwright install --with-deps chromium-headless-shell && npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
