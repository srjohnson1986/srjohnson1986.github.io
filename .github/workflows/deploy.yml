name: Deploy to GitHub Pages

on:
  # Build and publish on every push to main
  push:
    branches: [main]
  # Allow a manual run from the Actions tab
  workflow_dispatch:

# Permissions the deploy needs: read the code, publish to Pages
permissions:
  contents: read
  issues: read # the traceability report reads the requirement issues
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        # onnxruntime-node (used by npm run embeddings) would download GPU libraries in the action's own npm ci. This project uses the CPU only,
        # and CI never loads the model, so skip it: a slow download must not fail a build.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        with:
          # `npm run build` also prints the resume PDFs, which needs headless Chromium.
          # The action installs npm dependencies first, then runs this command in bash.
          #
          # Then it runs the test suite and writes the requirements traceability matrix into the site, over
          # the stand-in page at /development-qa/this-site/traceability/. The suite already had to pass in the
          # pull request, so a flaky failure here must not block a deploy: the test step and the report step
          # both tolerate problems, and the matrix shows the last result honestly. The smoke test fails if the
          # report did not make it into the site.
          build-cmd: >-
            npx playwright install --with-deps chromium-headless-shell &&
            npm run build &&
            (npx playwright test || true) &&
            node scripts/traceability.mjs --into dist --allow-problems

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
